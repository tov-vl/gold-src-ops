name: goldsrcops

x-logging: &bounded-logging
  driver: local
  options:
    max-file: "5"
    max-size: 10m

services:
  postgres:
    image: ${GOLDSRCOPS_POSTGRES_IMAGE:?Set GOLDSRCOPS_POSTGRES_IMAGE to an immutable digest reference}
    pull_policy: always
    restart: unless-stopped
    network_mode: none
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_DB: goldsrcops
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      POSTGRES_USER: goldsrcops
    secrets:
      - source: postgres-password
        target: postgres-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-socket:/var/run/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --host=/var/run/postgresql --username=$$POSTGRES_USER --dbname=$$POSTGRES_DB
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 30s
    logging: *bounded-logging

  api:
    profiles: [runtime]
    image: ${GOLDSRCOPS_IMAGE:?Set GOLDSRCOPS_IMAGE to an immutable digest reference}
    pull_policy: always
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - /app/api-entrypoint.sh
    environment:
      AllowedHosts: ${GOLDSRCOPS_HOSTNAME:?Set GOLDSRCOPS_HOSTNAME};api
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      Authentication__Schemes__Bearer__Authority: ${GOLDSRCOPS_AUTHENTICATION_AUTHORITY:?Set GOLDSRCOPS_AUTHENTICATION_AUTHORITY}
      Authentication__Schemes__Bearer__RoleClaimType: ${GOLDSRCOPS_AUTHENTICATION_ROLE_CLAIM_TYPE:?Set GOLDSRCOPS_AUTHENTICATION_ROLE_CLAIM_TYPE}
      Authentication__Schemes__Bearer__ValidAudiences__0: ${GOLDSRCOPS_AUTHENTICATION_AUDIENCE:?Set GOLDSRCOPS_AUTHENTICATION_AUDIENCE}
      DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE: "false"
      ReverseProxy__KnownProxy: ${GOLDSRCOPS_PROXY_IP:?Set GOLDSRCOPS_PROXY_IP}
      GOLDSRCOPS_RCON_SECRET_ALIAS: ${GOLDSRCOPS_RCON_SECRET_ALIAS:?Set GOLDSRCOPS_RCON_SECRET_ALIAS}
      AlertDelivery__Enabled: "false"
      Polling__Enabled: "true"
      SnapshotRetention__Enabled: "true"
      Telemetry__Otlp__Enabled: "true"
      Telemetry__Otlp__Endpoint: http://otel-collector:4317
      Telemetry__Otlp__Protocol: grpc
      Telemetry__Otlp__ExportIntervalMilliseconds: "60000"
      Telemetry__Otlp__ExportTimeoutMilliseconds: "30000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    secrets:
      - source: database-connection
        target: database-connection
      - source: rcon-password
        target: rcon-password
    volumes:
      - postgres-socket:/var/run/postgresql
    expose:
      - "8080"
    networks:
      edge:
        ipv4_address: ${GOLDSRCOPS_API_IP:?Set GOLDSRCOPS_API_IP}
        gw_priority: 1
      telemetry:
        ipv4_address: ${GOLDSRCOPS_API_TELEMETRY_IP:?Set GOLDSRCOPS_API_TELEMETRY_IP}
    stop_grace_period: 30s
    logging: *bounded-logging

  web:
    profiles: [runtime]
    image: ${GOLDSRCOPS_WEB_IMAGE:?Set GOLDSRCOPS_WEB_IMAGE to an immutable digest reference}
    pull_policy: always
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_started
    environment:
      AllowedHosts: ${GOLDSRCOPS_WEB_HOSTNAME:?Set GOLDSRCOPS_WEB_HOSTNAME};localhost
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE: "false"
      GoldSrcOpsApi__BaseUrl: http://api:8080/
      ReverseProxy__KnownProxy: ${GOLDSRCOPS_PROXY_IP:?Set GOLDSRCOPS_PROXY_IP}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    expose:
      - "8080"
    networks:
      edge:
        ipv4_address: ${GOLDSRCOPS_WEB_IP:?Set GOLDSRCOPS_WEB_IP}
    stop_grace_period: 30s
    logging: *bounded-logging

  migration:
    profiles: [operations]
    image: ${GOLDSRCOPS_IMAGE:?Set GOLDSRCOPS_IMAGE to an immutable digest reference}
    pull_policy: always
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - /app/api-entrypoint.sh
    command:
      - migrate
      - --no-color
      - --prefix-output
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_BUNDLE_EXTRACT_BASE_DIR: /tmp/.net
      DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE: "false"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    secrets:
      - source: database-connection
        target: database-connection
    volumes:
      - postgres-socket:/var/run/postgresql
    network_mode: none
    logging: *bounded-logging

  caddy:
    profiles: [runtime]
    image: ${GOLDSRCOPS_CADDY_IMAGE:?Set GOLDSRCOPS_CADDY_IMAGE to an immutable digest reference}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      GOLDSRCOPS_ACME_EMAIL: ${GOLDSRCOPS_ACME_EMAIL:?Set GOLDSRCOPS_ACME_EMAIL}
      GOLDSRCOPS_HOSTNAME: ${GOLDSRCOPS_HOSTNAME:?Set GOLDSRCOPS_HOSTNAME}
      GOLDSRCOPS_WEB_HOSTNAME: ${GOLDSRCOPS_WEB_HOSTNAME:?Set GOLDSRCOPS_WEB_HOSTNAME}
    ports:
      - target: 80
        published: "80"
        protocol: tcp
        mode: host
      - target: 443
        published: "443"
        protocol: tcp
        mode: host
      - target: 443
        published: "443"
        protocol: udp
        mode: host
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge:
        ipv4_address: ${GOLDSRCOPS_PROXY_IP:?Set GOLDSRCOPS_PROXY_IP}
    stop_grace_period: 30s
    logging: *bounded-logging

  otel-collector:
    profiles: [runtime]
    image: ${GOLDSRCOPS_OTEL_COLLECTOR_IMAGE:?Set GOLDSRCOPS_OTEL_COLLECTOR_IMAGE to an immutable digest reference}
    pull_policy: always
    restart: unless-stopped
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: ./observability/otel-collector.yml
        target: /etc/otelcol-contrib/config.yaml
        read_only: true
    expose:
      - "13133"
      - "4317"
      - "8888"
      - "9464"
    networks:
      telemetry:
        ipv4_address: ${GOLDSRCOPS_OTEL_COLLECTOR_IP:?Set GOLDSRCOPS_OTEL_COLLECTOR_IP}
    healthcheck:
      test:
        - CMD
        - /otelcol-contrib
        - validate
        - --config=/etc/otelcol-contrib/config.yaml
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s
    logging: *bounded-logging

  prometheus:
    profiles: [runtime]
    image: ${GOLDSRCOPS_PROMETHEUS_IMAGE:?Set GOLDSRCOPS_PROMETHEUS_IMAGE to an immutable digest reference}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      otel-collector:
        condition: service_started
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=1GB
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: ./observability/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
      - prometheus-data:/prometheus
    expose:
      - "9090"
    networks:
      telemetry:
        ipv4_address: ${GOLDSRCOPS_PROMETHEUS_IP:?Set GOLDSRCOPS_PROMETHEUS_IP}
    healthcheck:
      test:
        - CMD
        - /bin/wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:9090/-/ready
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s
    logging: *bounded-logging

  grafana:
    profiles: [runtime]
    image: ${GOLDSRCOPS_GRAFANA_IMAGE:?Set GOLDSRCOPS_GRAFANA_IMAGE to an immutable digest reference}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-admin-password
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /var/log/grafana:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    secrets:
      - source: grafana-admin-password
        target: grafana-admin-password
    volumes:
      - type: bind
        source: ./observability/grafana/provisioning/datasources
        target: /etc/grafana/provisioning/datasources
        read_only: true
      - type: bind
        source: ./observability/grafana/provisioning/dashboards
        target: /etc/grafana/provisioning/dashboards
        read_only: true
      - type: bind
        source: ./observability/grafana/dashboards
        target: /etc/grafana/dashboards
        read_only: true
      - grafana-data:/var/lib/grafana
    expose:
      - "3000"
    networks:
      telemetry:
        ipv4_address: ${GOLDSRCOPS_GRAFANA_IP:?Set GOLDSRCOPS_GRAFANA_IP}
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:3000/api/health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    logging: *bounded-logging

networks:
  edge:
    ipam:
      config:
        - subnet: ${GOLDSRCOPS_EDGE_SUBNET:?Set GOLDSRCOPS_EDGE_SUBNET}
  telemetry:
    internal: true
    ipam:
      config:
        - subnet: ${GOLDSRCOPS_TELEMETRY_SUBNET:?Set GOLDSRCOPS_TELEMETRY_SUBNET}

secrets:
  postgres-password:
    file: ${GOLDSRCOPS_POSTGRES_PASSWORD_FILE:?Set GOLDSRCOPS_POSTGRES_PASSWORD_FILE}
  database-connection:
    file: ${GOLDSRCOPS_DATABASE_CONNECTION_FILE:?Set GOLDSRCOPS_DATABASE_CONNECTION_FILE}
  rcon-password:
    file: ${GOLDSRCOPS_RCON_PASSWORD_FILE:?Set GOLDSRCOPS_RCON_PASSWORD_FILE}
  grafana-admin-password:
    file: ${GOLDSRCOPS_GRAFANA_ADMIN_PASSWORD_FILE:?Set GOLDSRCOPS_GRAFANA_ADMIN_PASSWORD_FILE}

volumes:
  postgres-data:
  postgres-socket:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:
