global:
  resolve_timeout: 5m
  http_config:
    follow_redirects: false

route:
  receiver: discard
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 6h
  routes:
    - receiver: monitoring-heartbeat
      matchers:
        - component="monitoring-pipeline"
        - severity="none"
        - alertname="MonitoringHeartbeat"
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m
    - receiver: owner-email
      matchers:
        - component="game-host-resources"
        - severity="warning"
        - alertname=~"GameHost(ResourceMonitorUnavailable|ResourceObservationInvalid|MemoryLow)"
    - receiver: owner-email
      matchers:
        - component="game-host-storage"
        - severity="warning"
        - alertname=~"GameHostStorage(MonitorUnavailable|ObservationInvalid|BytesLow|InodesLow)"
    - receiver: owner-email
      matchers:
        - component="game-event-agent"
        - severity="warning"
        - alertname=~"GameEventAgent(MonitorUnavailable|ObservationInvalid|WorkerProblem|QueueDelayed|SpoolProblem)"
    - receiver: owner-email
      matchers:
        - component="player-backup"
        - severity="warning"
        - alertname=~"PlayerBackup(MonitorUnavailable|ObservationInvalid|InterventionRequired|ScheduleProblem|CopyUnavailable)"

receivers:
  - name: discard
  - name: monitoring-heartbeat
    webhook_configs:
      - url_file: /run/secrets/irm-heartbeat-url
        send_resolved: false
        max_alerts: 1
        timeout: 10s
        # Heartbeat acceptance needs no host labels, queries or source payload.
        payload:
          project: goldsrcops
          environment: production
          heartbeat: monitoring-pipeline
  - name: owner-email
    webhook_configs:
      - url_file: /run/secrets/irm-webhook-url
        send_resolved: true
        max_alerts: 10
        timeout: 10s
        # Preserve Alertmanager's firing/resolved contract, but exclude raw
        # annotations, arbitrary labels, queries and private generator URLs.
        # One group per allowlisted alert name; IRM keeps payload.groupKey.
        payload:
          groupKey: 'goldsrcops.production.{{ .GroupLabels.alertname }}'
          status: '{{ .Status }}'
          receiver: owner-email
          groupLabels:
            alertname: '{{ .GroupLabels.alertname }}'
            project: goldsrcops
            environment: production
          commonLabels:
            alertname: '{{ .GroupLabels.alertname }}'
            component: '{{ .CommonLabels.component }}'
            severity: warning
          commonAnnotations:
            summary: 'GoldSrcOps - {{ .GroupLabels.alertname }}'
            runbook_url: '{{ if eq .CommonLabels.component "game-host-resources" }}https://github.com/tov-vl/gold-src-ops/blob/main/docs/v2.105-game-resource-monitor.md{{ else if eq .CommonLabels.component "game-host-storage" }}https://github.com/tov-vl/gold-src-ops/blob/main/docs/v2.104-game-storage-monitor.md{{ else if eq .CommonLabels.component "player-backup" }}https://github.com/tov-vl/gold-src-ops/blob/main/docs/game-player-data-monitoring.md{{ else }}https://github.com/tov-vl/gold-src-ops/blob/main/docs/v2.97-agent-alerts.md{{ end }}'
          externalURL: https://github.com/tov-vl/gold-src-ops/blob/main/docs/v2.98-owner-notifications.md
          alerts: >-
            {{ $safe := list }}{{ range .Alerts }}
            {{ $runbook := "v2.97-agent-alerts.md" }}{{ if eq .Labels.component "player-backup" }}{{ $runbook = "game-player-data-monitoring.md" }}{{ else if eq .Labels.component "game-host-storage" }}{{ $runbook = "v2.104-game-storage-monitor.md" }}{{ else if eq .Labels.component "game-host-resources" }}{{ $runbook = "v2.105-game-resource-monitor.md" }}{{ end }}
            {{ $safe = append $safe (dict "status" .Status
            "labels" (dict "alertname" .Labels.alertname "component" .Labels.component "severity" "warning")
            "annotations" (dict "summary" (printf "GoldSrcOps - %s" .Labels.alertname)
            "runbook_url" (printf "https://github.com/tov-vl/gold-src-ops/blob/main/docs/%s" $runbook))
            "startsAt" .StartsAt "endsAt" .EndsAt "fingerprint" .Fingerprint) }}
            {{ end }}{{ $safe | toJson }}
