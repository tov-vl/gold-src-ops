groups:
  - name: goldsrcops-credential-expiry
    rules:
      - record: goldsrcops_credentials:monitor_live
        expr: |
          (max(goldsrcops_credential_expiry_observed_timestamp_seconds{job="goldsrcops",service_name="GoldSrcOps"}) >= time() - 180) and (max(goldsrcops_credential_expiry_observed_timestamp_seconds{job="goldsrcops",service_name="GoldSrcOps"}) <= time())
      - alert: CredentialExpiryMonitorUnavailable
        expr: absent(goldsrcops_credentials:monitor_live)
        for: 5m
        labels:
          severity: warning
          component: credential-expiry
        annotations:
          summary: "Recorded credential expiry observation unavailable"
          runbook_url: "https://github.com/tov-vl/gold-src-ops/blob/main/docs/v2.116-credential-notifications.md"
      - record: goldsrcops_credentials:grafana_metrics_valid
        expr: |
          (count((goldsrcops_credential_expiry_state{job="goldsrcops",service_name="GoldSrcOps",purpose="grafana-metrics",state=~"Unknown|Recorded|Soon|Critical|Expired"} == 0) or (goldsrcops_credential_expiry_state{job="goldsrcops",service_name="GoldSrcOps",purpose="grafana-metrics",state=~"Unknown|Recorded|Soon|Critical|Expired"} == 1)) == 5) and (sum(goldsrcops_credential_expiry_state{job="goldsrcops",service_name="GoldSrcOps",purpose="grafana-metrics",state=~"Unknown|Recorded|Soon|Critical|Expired"}) == 1) and goldsrcops_credentials:monitor_live
      - alert: CredentialExpiryGrafanaMetricsSoon
        expr: |
          (max(goldsrcops_credential_expiry_state{job="goldsrcops",service_name="GoldSrcOps",purpose="grafana-metrics",state="Soon"}) == 1) and goldsrcops_credentials:grafana_metrics_valid
        for: 5m
        labels:
          severity: warning
          component: credential-expiry
        annotations:
          summary: "GrafanaMetrics: Recorded deadline within 30 days"
          runbook_url: "https://github.com/tov-vl/gold-src-ops/blob/main/docs/v2.116-credential-notifications.md"
      - alert: CredentialExpiryGrafanaMetricsCritical
        expr: |
          (max(goldsrcops_credential_expiry_state{job="goldsrcops",service_name="GoldSrcOps",purpose="grafana-metrics",state="Critical"}) == 1) and goldsrcops_credentials:grafana_metrics_valid
        for: 5m
        labels:
          severity: warning
          component: credential-expiry
        annotations:
          summary: "GrafanaMetrics: Recorded deadline within 7 days"
          runbook_url: "https://github.com/tov-vl/gold-src-ops/blob/main/docs/v2.116-credential-notifications.md"
      - alert: CredentialExpiryGrafanaMetricsExpired
        expr: |
          (max(goldsrcops_credential_expiry_state{job="goldsrcops",service_name="GoldSrcOps",purpose="grafana-metrics",state="Expired"}) == 1) and goldsrcops_credentials:grafana_metrics_valid
        for: 5m
        labels:
          severity: warning
          component: credential-expiry
        annotations:
          summary: "GrafanaMetrics: Recorded deadline reached; access failure is not established"
          runbook_url: "https://github.com/tov-vl/gold-src-ops/blob/main/docs/v2.116-credential-notifications.md"
      - alert: CredentialExpiryGrafanaMetricsUnknown
        expr: |
          ((max(goldsrcops_credential_expiry_state{job="goldsrcops",service_name="GoldSrcOps",purpose="grafana-metrics",state="Unknown"}) == 1) and goldsrcops_credentials:grafana_metrics_valid) or (absent(goldsrcops_credentials:grafana_metrics_valid) and goldsrcops_credentials:monitor_live)
        for: 5m
        labels:
          severity: warning
          component: credential-expiry
        annotations:
          summary: "GrafanaMetrics: Recorded expiry metadata unknown or observation invalid"
          runbook_url: "https://github.com/tov-vl/gold-src-ops/blob/main/docs/v2.116-credential-notifications.md"
      - record: goldsrcops_credentials:grafana_logs_valid
