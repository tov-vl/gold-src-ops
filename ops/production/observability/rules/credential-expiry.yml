          (count((goldsrcops_credential_expiry_state{job="goldsrcops",service_name="GoldSrcOps",purpose="grafana-logs",state=~"Unknown|Recorded|Soon|Critical|Expired"} == 0) or (goldsrcops_credential_expiry_state{job="goldsrcops",service_name="GoldSrcOps",purpose="grafana-logs",state=~"Unknown|Recorded|Soon|Critical|Expired"} == 1)) == 5) and (sum(goldsrcops_credential_expiry_state{job="goldsrcops",service_name="GoldSrcOps",purpose="grafana-logs",state=~"Unknown|Recorded|Soon|Critical|Expired"}) == 1) and goldsrcops_credentials:monitor_live
