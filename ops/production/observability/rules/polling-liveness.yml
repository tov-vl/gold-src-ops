groups:
  - name: goldsrcops-polling-liveness
    rules:
      - record: goldsrcops_polling:source_live
        expr: |
          (goldsrcops_polling_observed_timestamp_seconds{job="goldsrcops",service_name="GoldSrcOps"} >= time() - 120) and (goldsrcops_polling_observed_timestamp_seconds{job="goldsrcops",service_name="GoldSrcOps"} <= time()) and (goldsrcops_polling_started_timestamp_seconds{job="goldsrcops",service_name="GoldSrcOps"} > 0) and (goldsrcops_polling_started_timestamp_seconds{job="goldsrcops",service_name="GoldSrcOps"} <= time()) and (goldsrcops_polling_cycle_budget_seconds{job="goldsrcops",service_name="GoldSrcOps"} >= 300) and (goldsrcops_polling_cycle_budget_seconds{job="goldsrcops",service_name="GoldSrcOps"} <= 86400) and (goldsrcops_polling_state{job="goldsrcops",service_name="GoldSrcOps"} >= 0) and (goldsrcops_polling_state{job="goldsrcops",service_name="GoldSrcOps"} <= 4) and (goldsrcops_polling_state{job="goldsrcops",service_name="GoldSrcOps"} == floor(goldsrcops_polling_state{job="goldsrcops",service_name="GoldSrcOps"})) and (goldsrcops_polling_last_started_timestamp_seconds{job="goldsrcops",service_name="GoldSrcOps"} >= 0) and (goldsrcops_polling_last_started_timestamp_seconds{job="goldsrcops",service_name="GoldSrcOps"} <= time()) and (goldsrcops_polling_last_finished_timestamp_seconds{job="goldsrcops",service_name="GoldSrcOps"} >= 0) and (goldsrcops_polling_last_finished_timestamp_seconds{job="goldsrcops",service_name="GoldSrcOps"} <= time()) and ((goldsrcops_polling_enabled{job="goldsrcops",service_name="GoldSrcOps"} == 0) or (goldsrcops_polling_enabled{job="goldsrcops",service_name="GoldSrcOps"} == 1))
      - record: goldsrcops_polling:active_source
        expr: |
          (goldsrcops_polling_enabled{job="goldsrcops",service_name="GoldSrcOps"} == 1) and goldsrcops_polling:source_live and (goldsrcops_polling_state{job="goldsrcops",service_name="GoldSrcOps"} != 3)
      - record: goldsrcops_polling:active_state
        expr: |
          max(goldsrcops_polling_state{job="goldsrcops",service_name="GoldSrcOps"} and goldsrcops_polling:active_source) and (count(goldsrcops_polling:active_source) == 1)
      - record: goldsrcops_polling:progress_age_seconds
        expr: |
          time() - max((goldsrcops_polling_last_finished_timestamp_seconds{job="goldsrcops",service_name="GoldSrcOps"} + goldsrcops_polling_started_timestamp_seconds{job="goldsrcops",service_name="GoldSrcOps"} * (goldsrcops_polling_last_finished_timestamp_seconds{job="goldsrcops",service_name="GoldSrcOps"} == bool 0)) and goldsrcops_polling:active_source) and (count(goldsrcops_polling:active_source) == 1)
      - record: goldsrcops_polling:budget_seconds
        expr: |
          max(goldsrcops_polling_cycle_budget_seconds{job="goldsrcops",service_name="GoldSrcOps"} and goldsrcops_polling:active_source) and (count(goldsrcops_polling:active_source) == 1)
      - record: goldsrcops_polling:display_state
        expr: |
          (goldsrcops_polling:active_state unless (goldsrcops_polling:progress_age_seconds > goldsrcops_polling:budget_seconds)) or ((0 * goldsrcops_polling:progress_age_seconds + 4) and (goldsrcops_polling:progress_age_seconds > goldsrcops_polling:budget_seconds)) or (max(goldsrcops_polling_state{job="goldsrcops",service_name="GoldSrcOps"} and goldsrcops_polling:source_live) == 3 and absent(goldsrcops_polling:active_source))
      - alert: PollingMonitorUnavailable
        expr: |
          absent(goldsrcops_polling:active_state)
        for: 5m
        labels:
          severity: warning
          component: polling-liveness
        annotations:
          summary: "Active polling observation is unavailable"
          runbook_url: "https://github.com/tov-vl/gold-src-ops/blob/main/docs/v2.121-polling-liveness.md"
      - alert: PollingCycleStalled
        expr: |
          (goldsrcops_polling:progress_age_seconds > goldsrcops_polling:budget_seconds)
        for: 2m
        labels:
          severity: warning
          component: polling-liveness
        annotations:
          summary: "Polling cycle has no recent completion"
          runbook_url: "https://github.com/tov-vl/gold-src-ops/blob/main/docs/v2.121-polling-liveness.md"
      - alert: PollingCycleFailed
        expr: |
          (goldsrcops_polling:active_state == 2) unless (goldsrcops_polling:progress_age_seconds > goldsrcops_polling:budget_seconds)
        for: 2m
        labels:
          severity: warning
          component: polling-liveness
        annotations:
          summary: "Polling cycles are failing"
          runbook_url: "https://github.com/tov-vl/gold-src-ops/blob/main/docs/v2.121-polling-liveness.md"
