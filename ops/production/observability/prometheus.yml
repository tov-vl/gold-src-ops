global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/player-data-backup.yml
  - /etc/prometheus/rules/public-leaderboard.yml
  - /etc/prometheus/rules/web-public-api.yml
  - /etc/prometheus/rules/game-event-agent.yml

alerting:
  alert_relabel_configs:
    - source_labels: [component, severity, alertname]
      regex: game-event-agent;warning;GameEventAgent(MonitorUnavailable|ObservationInvalid|WorkerProblem|QueueDelayed|SpoolProblem)|player-backup;warning;PlayerBackup(MonitorUnavailable|ObservationInvalid|InterventionRequired|ScheduleProblem|CopyUnavailable)
      action: keep
    - regex: alertname|component|severity
      action: labelkeep
  alertmanagers:
    - timeout: 10s
      static_configs:
        - targets: [owner-alertmanager:9093]

scrape_configs:
  - job_name: goldsrcops
    static_configs:
      - targets:
          - otel-collector:9464

  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:8888
