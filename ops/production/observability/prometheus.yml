global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/player-data-backup.yml
  - /etc/prometheus/rules/public-leaderboard.yml
  - /etc/prometheus/rules/web-public-api.yml
  - /etc/prometheus/rules/game-event-agent.yml
  - /etc/prometheus/rules/game-host-storage.yml
  - /etc/prometheus/rules/game-host-resources.yml
  - /etc/prometheus/rules/monitoring-heartbeat.yml
  - /etc/prometheus/rules/credential-expiry.yml
  - /etc/prometheus/rules/archive-schedule.yml
  - /etc/prometheus/rules/polling-liveness.yml
  - /etc/prometheus/rules/snapshot-retention-liveness.yml
  - /etc/prometheus/rules/command-dispatch-liveness.yml

alerting:
  alert_relabel_configs:
    - source_labels: [component, severity, alertname]
      regex: game-event-agent;warning;GameEventAgent(MonitorUnavailable|ObservationInvalid|WorkerProblem|QueueDelayed|SpoolProblem)|player-backup;warning;PlayerBackup(MonitorUnavailable|ObservationInvalid|InterventionRequired|ScheduleProblem|CopyUnavailable)|game-host-storage;warning;GameHostStorage(MonitorUnavailable|ObservationInvalid|BytesLow|InodesLow)|game-host-resources;warning;GameHost(ResourceMonitorUnavailable|ResourceObservationInvalid|MemoryLow)|credential-expiry;warning;CredentialExpiry(MonitorUnavailable|(GrafanaMetrics|GrafanaLogs|ArchiveReader|ArchiveWriter)(Soon|Critical|Expired|Unknown))|archive-schedule;warning;ArchiveSchedule(MonitorUnavailable|ObservationInvalid|Delayed|CatchupAtRisk)|command-dispatch-liveness;warning;CommandDispatch(MonitorUnavailable|CycleStalled|CycleFailed)|snapshot-retention-liveness;warning;SnapshotRetention(MonitorUnavailable|CycleStalled|CycleFailed)|polling-liveness;warning;Polling(MonitorUnavailable|CycleStalled|CycleFailed)|monitoring-pipeline;none;MonitoringHeartbeat
      action: keep
    - regex: alertname|component|severity
      action: labelkeep
  alertmanagers:
    - timeout: 10s
      static_configs:
        - targets: [owner-alertmanager:9093]

scrape_configs:
  - job_name: goldsrcops
    static_configs:
      - targets:
          - otel-collector:9464

  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:8888
