name: goldsrcops-alert-receiver

x-logging: &bounded-logging
  driver: local
  options:
    max-file: "5"
    max-size: 10m

services:
  postgres:
    image: ${GOLDSRCOPS_ALERT_RECEIVER_POSTGRES_IMAGE:?Set GOLDSRCOPS_ALERT_RECEIVER_POSTGRES_IMAGE to an immutable digest reference}
    pull_policy: always
    restart: unless-stopped
    network_mode: none
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_DB: goldsrcops_receiver
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
      POSTGRES_PASSWORD_FILE: /run/secrets/receiver-postgres-password
      POSTGRES_USER: goldsrcops_receiver
    secrets:
      - source: receiver-postgres-password
        target: receiver-postgres-password
    volumes:
      - receiver-postgres-data:/var/lib/postgresql/data
      - receiver-postgres-socket:/var/run/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --host=/var/run/postgresql --username=$$POSTGRES_USER --dbname=$$POSTGRES_DB
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 30s
    logging: *bounded-logging
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G

  receiver:
    profiles: [runtime]
    image: ${GOLDSRCOPS_ALERT_RECEIVER_IMAGE:?Set GOLDSRCOPS_ALERT_RECEIVER_IMAGE to an immutable digest reference}
    pull_policy: always
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - /app/receiver-entrypoint.sh
    environment:
      AllowedHosts: ${GOLDSRCOPS_ALERT_RECEIVER_HOSTNAME:?Set GOLDSRCOPS_ALERT_RECEIVER_HOSTNAME};receiver;localhost
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE: "false"
      ProviderDelivery__Enabled: "false"
      ProviderOperations__Enabled: "false"
      Receiver__Mode: CatchUp
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    secrets:
      - source: receiver-database-connection
        target: receiver-database-connection
      - source: receiver-authorization
        target: receiver-authorization
    volumes:
      - receiver-postgres-socket:/var/run/postgresql
    expose:
      - "8080"
    networks:
      edge:
        aliases:
          - goldsrcops-alert-receiver
        ipv4_address: ${GOLDSRCOPS_ALERT_RECEIVER_IP:?Set GOLDSRCOPS_ALERT_RECEIVER_IP}
    stop_grace_period: 30s
    logging: *bounded-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  migration:
    profiles: [operations]
    image: ${GOLDSRCOPS_ALERT_RECEIVER_IMAGE:?Set GOLDSRCOPS_ALERT_RECEIVER_IMAGE to an immutable digest reference}
    pull_policy: always
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - /app/receiver-entrypoint.sh
    command:
      - migrate
      - --no-color
      - --prefix-output
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_BUNDLE_EXTRACT_BASE_DIR: /tmp/.net
      DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE: "false"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=0700,uid=1654,gid=1654
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    secrets:
      - source: receiver-database-connection
        target: receiver-database-connection
    volumes:
      - receiver-postgres-socket:/var/run/postgresql
    network_mode: none
    logging: *bounded-logging

  caddy:
    profiles: [standalone]
    image: ${GOLDSRCOPS_ALERT_RECEIVER_CADDY_IMAGE:?Set GOLDSRCOPS_ALERT_RECEIVER_CADDY_IMAGE to an immutable digest reference}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      receiver:
        condition: service_started
    environment:
      GOLDSRCOPS_ALERT_RECEIVER_ACME_EMAIL: ${GOLDSRCOPS_ALERT_RECEIVER_ACME_EMAIL:?Set GOLDSRCOPS_ALERT_RECEIVER_ACME_EMAIL}
      GOLDSRCOPS_ALERT_RECEIVER_HOSTNAME: ${GOLDSRCOPS_ALERT_RECEIVER_HOSTNAME:?Set GOLDSRCOPS_ALERT_RECEIVER_HOSTNAME}
    ports:
      - target: 80
        published: "80"
        protocol: tcp
        mode: host
      - target: 443
        published: "443"
        protocol: tcp
        mode: host
      - target: 443
        published: "443"
        protocol: udp
        mode: host
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
      - receiver-caddy-data:/data
      - receiver-caddy-config:/config
    networks:
      edge:
        ipv4_address: ${GOLDSRCOPS_ALERT_RECEIVER_PROXY_IP:?Set GOLDSRCOPS_ALERT_RECEIVER_PROXY_IP}
    stop_grace_period: 30s
    logging: *bounded-logging

networks:
  edge:
    ipam:
      config:
        - subnet: ${GOLDSRCOPS_ALERT_RECEIVER_EDGE_SUBNET:?Set GOLDSRCOPS_ALERT_RECEIVER_EDGE_SUBNET}

secrets:
  receiver-postgres-password:
    file: ${GOLDSRCOPS_ALERT_RECEIVER_POSTGRES_PASSWORD_FILE:?Set GOLDSRCOPS_ALERT_RECEIVER_POSTGRES_PASSWORD_FILE}
  receiver-database-connection:
    file: ${GOLDSRCOPS_ALERT_RECEIVER_DATABASE_CONNECTION_FILE:?Set GOLDSRCOPS_ALERT_RECEIVER_DATABASE_CONNECTION_FILE}
  receiver-authorization:
    file: ${GOLDSRCOPS_ALERT_RECEIVER_AUTHORIZATION_FILE:?Set GOLDSRCOPS_ALERT_RECEIVER_AUTHORIZATION_FILE}

volumes:
  receiver-postgres-data:
  receiver-postgres-socket:
  receiver-caddy-data:
  receiver-caddy-config:
