services:
  receiver:
    networks:
      edge: !override
        aliases:
          - goldsrcops-alert-receiver
        ipv4_address: ${GOLDSRCOPS_ALERT_RECEIVER_CONTROL_PLANE_IP:?Set GOLDSRCOPS_ALERT_RECEIVER_CONTROL_PLANE_IP}

networks:
  edge: !override
    name: ${GOLDSRCOPS_ALERT_RECEIVER_EDGE_NETWORK:?Set GOLDSRCOPS_ALERT_RECEIVER_EDGE_NETWORK to the existing control-plane edge network}
    external: true
