global:
  scrape_interval: 1s
  scrape_timeout: 900ms
  evaluation_interval: 1s
  external_labels:
    environment: wal-lab
rule_files:
  - /lab/wal.rules.yml
scrape_configs:
  - job_name: wal-lab
    static_configs:
      - targets: ['collector:8181']
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
