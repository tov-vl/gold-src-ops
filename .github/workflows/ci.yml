          if output="$(docker buildx imagetools inspect "$revision_ref" 2>&1)"; then
            if [[ "$RELEASE_CHANNEL" != "stable" ]]; then
              echo "::error title=AlertReceiver revision image already exists::$revision_ref already belongs to an immutable publication."
              exit 1
            fi

            source_digest="$(awk '/^Digest:/ { print $2; exit }' <<< "$output")"
            if [[ ! "$source_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "$output"
              echo "::error title=Invalid AlertReceiver registry digest::Could not resolve the digest for $revision_ref."
              exit 1
            fi

            docker pull "$IMAGE@$source_digest" > /dev/null
            artifact_source="$(docker image inspect \
              --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' \
              "$IMAGE@$source_digest")"
            artifact_revision="$(docker image inspect \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
              "$IMAGE@$source_digest")"
            artifact_version="$(docker image inspect \
              --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' \
              "$IMAGE@$source_digest")"
            artifact_license="$(docker image inspect \
              --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}' \
              "$IMAGE@$source_digest")"

            if [[ "$artifact_source" != "$EXPECTED_IMAGE_SOURCE" || \
                  "$artifact_revision" != "$RELEASE_REVISION" || \
                  "$artifact_license" != "MIT" ]]; then
              echo "::error title=AlertReceiver candidate metadata mismatch::The existing revision image does not match the expected source, revision, and license."
              exit 1
            fi

            pwsh -NoLogo -NoProfile -File ./tools/ci/resolve-image-tag.ps1 \
              -Tag "v$artifact_version" \
              -ExpectedChannel release-candidate \
              -ExpectedBaseVersion "$RELEASE_BASE_VERSION" > /dev/null

            promotion_args=()
            if [[ "$release_exists" == "true" ]]; then
              existing_digest="$(awk '/^Digest:/ { print $2; exit }' <<< "$release_output")"
              existing_raw="$(docker buildx imagetools inspect --raw "$release_ref")"
              existing_media_type="$(jq -r '.mediaType // ""' <<< "$existing_raw")"
              existing_child_digests="$(jq -c '[.manifests[]?.digest]' <<< "$existing_raw")"

              promotion_args+=(
                -ExistingDigest "$existing_digest"
                -ExistingMediaType "$existing_media_type"
                -ExistingChildDigestsJson "$existing_child_digests")

              if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
                promotion_args+=(-AllowExistingReference)
              fi
            fi

            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" &&
                  "$ALLOW_SINGLE_MANIFEST_RECOVERY" == "true" ]]; then
              promotion_args+=(-AllowSingleManifestRecovery)
            fi

            mode="$(pwsh -NoLogo -NoProfile \
              -File ./tools/ci/resolve-image-promotion.ps1 \
              -SourceDigest "$source_digest" \
              "${promotion_args[@]}")"

            if [[ "$mode" == "recover" ]]; then
              response_file="$(mktemp)"
              status_code="$(curl --silent --show-error \
                --output "$response_file" \
                --write-out '%{http_code}' \
                --header 'Accept: application/vnd.github+json' \
                --header "Authorization: Bearer $GITHUB_TOKEN" \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
              rm -f "$response_file"

              if [[ "$status_code" == "200" ]]; then
                echo "::error title=Published release cannot be recovered::A GitHub Release already exists for $RELEASE_TAG."
                exit 1
              fi

              if [[ "$status_code" != "404" ]]; then
                echo "::error title=Release lookup failed::GitHub returned HTTP $status_code while checking $RELEASE_TAG."
                exit 1
              fi
            fi

            {
              echo "artifact_version=$artifact_version"
              echo "mode=$mode"
              echo "source_digest=$source_digest"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! grep -Eiq 'manifest unknown|not found' <<< "$output"; then
            echo "$output"
            echo "::error title=AlertReceiver registry lookup failed::Could not determine whether $revision_ref exists."
            exit 1
          fi

          if [[ "$release_exists" == "true" ]]; then
            echo "::error title=Immutable AlertReceiver image tag already exists::$release_ref already exists and will not be overwritten."
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "::error title=Missing AlertReceiver candidate image::Manual publication can resume only an existing stable candidate revision."
            exit 1
          fi

          {
            echo "artifact_version=$RELEASE_VERSION"
            echo "mode=build"
            echo "source_digest="
          } >> "$GITHUB_OUTPUT"

      - name: Create AlertReceiver image metadata
        id: metadata
        if: steps.registry.outputs.mode == 'build'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.release.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.release.outputs.tag }}
            type=raw,value=sha-${{ steps.release.outputs.revision }}
          labels: |
            org.opencontainers.image.title=GoldSrcOps AlertReceiver
            org.opencontainers.image.description=Provider-independent delivery receiver for GoldSrcOps availability events
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release.outputs.revision }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.licenses=MIT

      - name: Build and publish production AlertReceiver image
        id: publish
        if: steps.registry.outputs.mode == 'build'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.receiver
          platforms: linux/amd64
          pull: true
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}

      - name: Promote verified AlertReceiver candidate digest
        if: steps.registry.outputs.mode == 'promote' || steps.registry.outputs.mode == 'recover'
        shell: bash
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SOURCE_DIGEST: ${{ steps.registry.outputs.source_digest }}
        run: |
          set -euo pipefail

          docker buildx imagetools create \
            --prefer-index=false \
            --tag "$IMAGE:$RELEASE_TAG" \
            "$IMAGE@$SOURCE_DIGEST"

          output="$(docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG")"
          published_digest="$(awk '/^Digest:/ { print $2; exit }' <<< "$output")"
          if [[ "$published_digest" != "$SOURCE_DIGEST" ]]; then
            echo "$output"
            echo "::error title=AlertReceiver candidate promotion changed digest::Expected $SOURCE_DIGEST, got $published_digest."
            exit 1
          fi

      - name: Resolve AlertReceiver publication result
        id: publication
        shell: bash
        env:
          ARTIFACT_VERSION: ${{ steps.registry.outputs.artifact_version }}
          BUILD_DIGEST: ${{ steps.publish.outputs.digest }}
          MODE: ${{ steps.registry.outputs.mode }}
          SOURCE_DIGEST: ${{ steps.registry.outputs.source_digest }}
        run: |
          set -euo pipefail

          if [[ "$MODE" == "build" ]]; then
            digest="$BUILD_DIGEST"
          else
            digest="$SOURCE_DIGEST"
          fi

          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error title=Invalid AlertReceiver publication digest::The publication did not produce an immutable sha256 digest."
            exit 1
          fi

          {
            echo "artifact_version=$ARTIFACT_VERSION"
            echo "digest=$digest"
            echo "mode=$MODE"
          } >> "$GITHUB_OUTPUT"

      - name: Record published AlertReceiver digest
        shell: bash
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          IMAGE_DIGEST: ${{ steps.publication.outputs.digest }}
          PUBLICATION_MODE: ${{ steps.publication.outputs.mode }}
          RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
          RELEASE_REVISION: ${{ steps.release.outputs.revision }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          {
            echo "## Published immutable AlertReceiver image"
            echo
            echo "- Image tag: $RELEASE_TAG"
            echo "- Publication channel: $RELEASE_CHANNEL"
            echo "- Publication mode: $PUBLICATION_MODE"
            echo "- Source revision: $RELEASE_REVISION"
            echo "- Deployment reference: $IMAGE@$IMAGE_DIGEST"
            echo "- Mutable latest tag: not published"
            echo "- Digest smoke test: pending Verify Published AlertReceiver Image"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-published-alert-receiver-image:
    name: Verify Published AlertReceiver Image
    needs: publish-alert-receiver-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout release revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke-test published AlertReceiver digest
        shell: pwsh
        env:
          EXPECTED_IMAGE_REVISION: ${{ needs.publish-alert-receiver-image.outputs.revision }}
          EXPECTED_IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          EXPECTED_IMAGE_VERSION: ${{ needs.publish-alert-receiver-image.outputs.artifact_version }}
          IMAGE_REFERENCE: ${{ needs.publish-alert-receiver-image.outputs.image }}@${{ needs.publish-alert-receiver-image.outputs.digest }}
        run: |
          ./tools/smoke/alert-receiver-container.ps1 `
            -Image $env:IMAGE_REFERENCE `
            -ExpectedImageSource $env:EXPECTED_IMAGE_SOURCE `
            -ExpectedImageRevision $env:EXPECTED_IMAGE_REVISION `
            -ExpectedImageVersion $env:EXPECTED_IMAGE_VERSION

      - name: Record AlertReceiver digest verification
        shell: bash
        env:
          IMAGE: ${{ needs.publish-alert-receiver-image.outputs.image }}
          IMAGE_DIGEST: ${{ needs.publish-alert-receiver-image.outputs.digest }}
          PUBLICATION_MODE: ${{ needs.publish-alert-receiver-image.outputs.mode }}
          RELEASE_CHANNEL: ${{ needs.publish-alert-receiver-image.outputs.channel }}
          RELEASE_TAG: ${{ needs.publish-alert-receiver-image.outputs.tag }}
        run: |
          {
            echo "## Verified immutable AlertReceiver image"
            echo
            echo "- Image tag: $RELEASE_TAG"
            echo "- Publication channel: $RELEASE_CHANNEL"
            echo "- Publication mode: $PUBLICATION_MODE"
            echo "- Deployment reference: $IMAGE@$IMAGE_DIGEST"
            echo "- Digest smoke test: passed"
          } >> "$GITHUB_STEP_SUMMARY"
