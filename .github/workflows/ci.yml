name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Print .NET info
        run: dotnet --info

      - name: Restore with NuGet audit
        run: dotnet restore GoldSrcOps.sln -p:AuditPipeline=true

      - name: Verify formatting
        run: dotnet format GoldSrcOps.sln --verify-no-changes --verbosity minimal --no-restore

      - name: Build
        run: dotnet build GoldSrcOps.sln --no-restore

      - name: Test
        run: dotnet test GoldSrcOps.sln --no-build

      - name: Report vulnerable packages
        run: dotnet list GoldSrcOps.sln package --vulnerable --include-transitive

  container-smoke:
    name: Container Smoke
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOCKER_BUILDKIT: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Run container smoke test
        run: pwsh -NoProfile -File ./tools/smoke/container.ps1
