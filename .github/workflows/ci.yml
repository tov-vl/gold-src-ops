name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Print .NET info
        run: dotnet --info

      - name: Restore with NuGet audit
        run: dotnet restore GoldSrcOps.sln -p:AuditPipeline=true

      - name: Verify formatting
        run: dotnet format GoldSrcOps.sln --verify-no-changes --verbosity minimal --no-restore

      - name: Build
        run: dotnet build GoldSrcOps.sln --no-restore

      - name: Test
        run: dotnet test GoldSrcOps.sln --no-build

      - name: Report vulnerable packages
        run: dotnet list GoldSrcOps.sln package --vulnerable --include-transitive

  container-smoke:
    name: Container Smoke
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOCKER_BUILDKIT: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Validate production Compose contract
        run: >-
          pwsh -NoProfile -File ./ops/production/preflight.ps1
          -EnvironmentFile ./ops/production/deployment.env.example
          -ContractOnly

      - name: Validate host-readiness preflight
        run: pwsh -NoProfile -File ./tools/smoke/host-preflight.ps1

      - name: Run container smoke test
        run: pwsh -NoProfile -File ./tools/smoke/container.ps1

  publish-image:
    name: Publish Image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - quality
      - container-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ghcr-release-publication
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      image: ${{ steps.release.outputs.image }}
      revision: ${{ steps.release.outputs.revision }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout release revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        id: release
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Invalid release tag::Expected v<major>.<minor>.<patch>, got '$GITHUB_REF_NAME'."
            exit 1
          fi

          if [[ "$(git cat-file -t "$GITHUB_REF")" != "tag" ]]; then
            echo "::error title=Lightweight release reference::Release tags must be annotated."
            exit 1
          fi

          revision="$(git rev-list -n 1 "$GITHUB_REF")"
          git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"

          if ! git merge-base --is-ancestor "$revision" "origin/$DEFAULT_BRANCH"; then
            echo "::error title=Untrusted release revision::The tagged commit is not reachable from '$DEFAULT_BRANCH'."
            exit 1
          fi

          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME#v}"

          {
            echo "image=$image"
            echo "revision=$revision"
            echo "tag=$GITHUB_REF_NAME"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject existing immutable tags
        shell: bash
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          RELEASE_REVISION: ${{ steps.release.outputs.revision }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          for tag in "$RELEASE_TAG" "sha-$RELEASE_REVISION"; do
            image_ref="$IMAGE:$tag"

            if output="$(docker buildx imagetools inspect "$image_ref" 2>&1)"; then
              echo "::error title=Immutable image tag already exists::$image_ref already exists and will not be overwritten."
              exit 1
            fi

            if ! grep -Eiq 'manifest unknown|not found' <<< "$output"; then
              echo "$output"
              echo "::error title=Registry lookup failed::Could not prove that $image_ref is unused."
              exit 1
            fi
          done

      - name: Create image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.release.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.release.outputs.tag }}
            type=raw,value=sha-${{ steps.release.outputs.revision }}
          labels: |
            org.opencontainers.image.title=GoldSrcOps
            org.opencontainers.image.description=Provider-independent GoldSrc fleet control plane
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release.outputs.revision }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.licenses=MIT

      - name: Build and publish production image
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}

      - name: Record published digest
        shell: bash
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          RELEASE_REVISION: ${{ steps.release.outputs.revision }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          {
            echo "## Published production image"
            echo
            echo "- Release tag: \`$RELEASE_TAG\`"
            echo "- Source revision: \`$RELEASE_REVISION\`"
            echo "- Deployment reference: \`$IMAGE@$IMAGE_DIGEST\`"
            echo "- Mutable \`latest\` tag: not published"
            echo "- Digest smoke test: pending \`Verify Published Image\`"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-published-image:
    name: Verify Published Image
    needs: publish-image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout release revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke-test published digest
        shell: pwsh
        env:
          EXPECTED_IMAGE_REVISION: ${{ needs.publish-image.outputs.revision }}
          EXPECTED_IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          EXPECTED_IMAGE_VERSION: ${{ needs.publish-image.outputs.version }}
          IMAGE_REFERENCE: ${{ needs.publish-image.outputs.image }}@${{ needs.publish-image.outputs.digest }}
        run: |
          ./tools/smoke/container.ps1 `
            -ImageReference $env:IMAGE_REFERENCE `
            -ExpectedImageSource $env:EXPECTED_IMAGE_SOURCE `
            -ExpectedImageRevision $env:EXPECTED_IMAGE_REVISION `
            -ExpectedImageVersion $env:EXPECTED_IMAGE_VERSION

      - name: Record digest verification
        shell: bash
        env:
          IMAGE: ${{ needs.publish-image.outputs.image }}
          IMAGE_DIGEST: ${{ needs.publish-image.outputs.digest }}
          RELEASE_TAG: ${{ needs.publish-image.outputs.tag }}
        run: |
          {
            echo "## Verified production image"
            echo
            echo "- Release tag: \`$RELEASE_TAG\`"
            echo "- Deployment reference: \`$IMAGE@$IMAGE_DIGEST\`"
            echo "- Digest smoke test: passed"
          } >> "$GITHUB_STEP_SUMMARY"
